name: TaskOn Quest Report

on:
  schedule:
    # UTC 03:00 = WIB 10:00 (WIB = UTC+7)
    - cron: '0 3 * * *'
  workflow_dispatch:   # biar bisa dijalankan manual dari tab Actions

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Jalankan scraper + kirim laporan ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python taskon_report.py
